title: "[Q&A] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: Please check docs/TROUBLESHOOTING.md first. Remove tokens and secret paths before posting.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do?
    validations:
      required: true
  - type: input
    id: illustrator
    attributes:
      label: Illustrator version
  - type: dropdown
    id: client
    attributes:
      label: AI client
      options:
        - Claude Desktop
        - ChatGPT
        - Other
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics output
      description: Output of scripts\diagnostics.ps1 (optional)
      render: text
